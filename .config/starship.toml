"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = 'tokyo_night'

format = """
$os$directory$git_branch$git_status$fill$status$cmd_duration$time
$character"""

[palettes.tokyo_night]
bg = '#1a1b26'
fg = '#c0caf5'
dim = '#565f89'
blue = '#7aa2f7'
cyan = '#7dcfff'
green = '#9ece6a'
purple = '#bb9af7'
red = '#f7768e'
orange = '#ff9e64'
yellow = '#e0af68'
teal = '#1abc9c'

[fill]
symbol = '─'
style = 'dim'

[os]
disabled = false
format = '[$symbol]($style) '
style = 'bold purple'

[os.symbols]
Macos = ''
Linux = ''
Ubuntu = ''
Debian = ''

[directory]
style = 'bold blue'
truncation_length = 2
truncate_to_repo = false
truncation_symbol = '…/'
read_only = ' 󰌾'
read_only_style = 'red'

[git_branch]
symbol = ' '
format = '[$symbol$branch]($style) '
style = 'bold purple'

[git_status]
style = 'bold yellow'
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = '~${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
stashed = '*${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

[status]
disabled = false
symbol = '✘'
format = '[$symbol$status]($style) '
style = 'bold red'
map_symbol = false

[cmd_duration]
min_time = 2000
format = '[󰔟 $duration]($style) '
style = 'orange'

[time]
disabled = false
time_format = '%I:%M:%S %p'
format = '[󰥔 $time]($style)'
style = 'bold cyan'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'
