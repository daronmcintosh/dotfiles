"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
$os$directory$git_branch$git_status$fill$status$cmd_duration$time
$character"""

[fill]
symbol = '─'
style = 'bright-black'

[os]
disabled = false
format = '[$symbol]($style) '
style = 'bold white'

[os.symbols]
Macos = ''
Linux = ''
Ubuntu = ''
Debian = ''

[directory]
style = 'bold cyan'
truncation_length = 2
truncate_to_repo = false
truncation_symbol = '…/'
read_only = ' 󰌾'

[git_branch]
symbol = ' '
format = '[$symbol$branch]($style) '
style = 'bold green'

[git_status]
style = 'bold green'
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = '~${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
stashed = '*${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

[status]
disabled = false
symbol = '✘'
format = '[$symbol$status]($style) '
style = 'bold red'
map_symbol = false

[cmd_duration]
min_time = 2000
format = '[󰔟 $duration]($style) '
style = 'yellow'

[time]
disabled = false
time_format = '%I:%M:%S %p'
format = '[󰥔 $time]($style)'
style = 'bold #5f8787'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'
